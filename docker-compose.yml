version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: previare_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-previare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-previare_pass}
      POSTGRES_DB: ${POSTGRES_DB:-previare_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-previare_user} -d ${POSTGRES_DB:-previare_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - previare_network

  # -------------------------------------------------------------
  # NestJS Backend API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: previare_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-previare_user}:${POSTGRES_PASSWORD:-previare_pass}@postgres:5432/${POSTGRES_DB:-previare_db}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
      MAIL_TO: ${MAIL_TO:-contato@amoadvogados.com.br}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - previare_network

  # -------------------------------------------------------------
  # Next.js Frontend Application Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: previare_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # Rota /api/leads do Next encaminha para o backend pela rede interna
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend
    networks:
      - previare_network

volumes:
  postgres_data:
    driver: local

networks:
  previare_network:
    driver: bridge
